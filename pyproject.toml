[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knicks-history"
version = "0.1.0"
description = "Replayable Knicks team-game ETL with explicit historical coverage"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["nba-api==1.12.0"]
columnar = ["polars>=1,<2"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
ml = [
    "joblib==1.6.0",
    "numpy>=2,<3",
    "pandas==2.3.3",
    "polars==1.44.2",
    "scikit-learn==1.9.1",
]
research = [
    "joblib==1.6.0",
    "nba-api==1.12.0",
    "numpy>=2,<3",
    "pandas==2.3.3",
    "polars==1.44.2",
    "scikit-learn==1.9.1",
]
visualization = [
    "d3blocks==2.3.4",
    "matplotlib==3.11.2",
    "pandas==2.3.3",
    "polars==1.44.2",
]

[project.scripts]
knicks = "knicks_history.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
